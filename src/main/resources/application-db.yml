---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    write:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${DB_WRITE_HOST:localhost}:${DB_WRITE_PORT:5432}/${DB_NAME:safehome}
      username: ${DB_USERNAME:safehome}
      password: ${DB_PASSWORD}
    read:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${DB_READ_HOST:localhost}:${DB_READ_PORT:5433}/${DB_NAME:safehome}
      username: ${DB_USERNAME:safehome}
      password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 600000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: HikariCP
      connection-test-query: SELECT 1

  sql:
    init:
      schema-locations: classpath*:init/postgresql/schema.sql
      data-locations: classpath*:init/postgresql/data.sql
      mode: ${SQL_INIT_MODE:always}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    format_sql: true

---
spring:
  config:
    activate:
      on-profile: local

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true  # 외부 접근 허용 (개발 환경에서만)

  datasource:
    write:
      driver-class-name: org.h2.Driver
      url: jdbc:h2:file:./project-safehome-api/h2db/db/application;MODE=MYSQL;DATABASE_TO_UPPER=false
      username: sa
      password:
    read:
      driver-class-name: org.h2.Driver
      url: jdbc:h2:file:./project-safehome-api/h2db/db/application;MODE=MYSQL;DATABASE_TO_UPPER=false;ACCESS_MODE_DATA=r
      username: sa
      password:
    hikari:
      minimum-idle: 2                      # 최소 유지할 커넥션 수
      maximum-pool-size: 5                 # 최대 커넥션 수
      idle-timeout: 600000                 # 커넥션이 사용되지 않을 경우 대기 시간 (밀리초)
      max-lifetime: 600000                 # 커넥션의 최대 수명 (밀리초)
      connection-timeout: 30000            # 커넥션 풀에서 커넥션을 얻기까지의 최대 대기 시간 (밀리초)
      pool-name: HikariCP                  # 커넥션 풀의 이름
      connection-test-query: SELECT 1      # 커넥션을 확인할 때 사용할 쿼리 (MySQL 기준)

  sql:
    init:
      schema-locations: classpath*:init/h2db/schema.sql
      data-locations: classpath*:init/h2db/data.sql
      mode: ${SQL_INIT_MODE:always}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    show-sql: true
    format_sql: true

