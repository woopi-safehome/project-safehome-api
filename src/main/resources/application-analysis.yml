safehome:
  analysis:
    # 한 계정이 하루에 시작할 수 있는 분석 수. 실패한 분석은 세지 않는다.
    # 기본값을 주지 않는다 — 이 파일이 import 에 등록되지 않으면 기동이 실패해야 한다.
    daily-limit: 3
    anonymous:
      # 같은 주소에서 하루에 시작할 수 있는 분석 수.
      #
      # ⚠️ 앞단이 원래 요청자의 주소 헤더를 붙여 줄 때만 사람마다 세어진다.
      # 웹 프론트는 그 헤더를 만들어 붙이지 않으므로, 그 앞에 붙이는 프록시가 없으면
      # 웹으로 들어온 비회원 전체가 한 주소로 보인다 — 이 값이 1 이면 하루 첫 한 건 뒤로 전부 막힌다.
      daily-limit-per-client: 1
      # 비회원 전체가 하루에 시작할 수 있는 분석 수 — 비용의 천장이다.
      # 주소는 바꿀 수 있지만 이 값은 넘지 못한다.
      # 회원은 여기 세지 않는다. 비회원이 몰려도 회원의 하루치는 남아 있어야 한다.
      daily-limit-total: 100
