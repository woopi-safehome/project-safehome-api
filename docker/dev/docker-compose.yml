services:
  safehome-api:
    image: ghcr.io/${GITHUB_OWNER}/safehome-api:dev
    container_name: safehome-api-dev
    env_file: /home/woopi/project/safehome/env/.env_api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_WRITE_HOST: postgres-primary
      DB_WRITE_PORT: 5432
      DB_READ_HOST: postgres-replica
      DB_READ_PORT: 5432
      REDIS_HOST: safehome-redis
      AI_API_URL: http://safehome-ai-api-dev:5000
      PIGEON_URL: http://pigeon-dev:8081
    ports:
      - "8080:8080"
    networks:
      - postgres-net
      - safehome-net
    depends_on:
      postgres-primary:
        condition: service_healthy
      safehome-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres-primary:
    image: postgres:17
    container_name: safehome-dev-primary
    env_file: /home/woopi/project/safehome/env/.env_api
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./init/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - postgres-net
      - safehome-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:17
    container_name: safehome-dev-replica
    env_file: /home/woopi/project/safehome/env/.env_api
    environment:
      TZ: Asia/Seoul
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./init/init-replica.sh:/init-replica.sh
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - postgres-net
      - safehome-net
    depends_on:
      postgres-primary:
        condition: service_healthy
    command: >
      bash -c "
        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
          bash /init-replica.sh
        fi
        exec docker-entrypoint.sh postgres
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  safehome-redis:
    image: redis:7-alpine
    container_name: safehome-dev-redis
    environment:
      TZ: Asia/Seoul
    command: redis-server --save 60 1 --loglevel warning --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - safehome-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-primary-data:
  postgres-replica-data:
  redis-data:

networks:
  postgres-net:
    driver: bridge
  safehome-net:
    external: true
